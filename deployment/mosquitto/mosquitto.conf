# Listener 1883: Chi dung trong moi truong phat trien (dev).
# O ban san xuat cuoi cung, dat MOSQUITTO_CONF_FILE=./mosquitto/mosquitto.prod.conf de tat 1883.
listener 1883 0.0.0.0

# Listener 8883: MQTT over TLS (ma hoa duong truyen cho ESP32 va client)
listener 8883 0.0.0.0
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
persistence true
persistence_location /mosquitto/data/
log_dest stdout
