services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: wms-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ${MOSQUITTO_CONF_FILE:-./mosquitto/mosquitto.conf}:/mosquitto/config/mosquitto.conf:ro
      - ./certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - wms_net

  mysql:
    image: mysql:8.0
    container_name: wms-mysql
    restart: unless-stopped
    env_file:
      - ../.env
    # Khong mo cong MySQL (3306) ra may chu de dam bao an toan mang noi bo
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks:
      - wms_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: wms-backend
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app:ro
      - ../database:/app/database:ro
      - ../tests:/app/tests:ro
      - ../docs:/app/docs
    depends_on:
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - wms_net

  frontend:
    image: nginx:alpine
    container_name: wms-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ../frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - wms_net

volumes:
  mysql_data:
  mosquitto_data:
  mosquitto_log:

networks:
  wms_net:
    driver: bridge
